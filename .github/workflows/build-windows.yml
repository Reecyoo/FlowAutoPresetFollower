name: Build Windows VST3

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git C:/JUCE

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target FlowAutoPresetFollower_VST3

      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowAutoPresetFollower-Windows-VST3
          path: build/FlowAutoPresetFollower_artefacts/Release/VST3/
